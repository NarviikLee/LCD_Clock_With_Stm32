<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ device_name }} Records</title>
</head>
<body>
    <h1>{{ device_name }} Records</h1>
    <table border="1">
        <tr>
            <th>Date</th>
            <th>Index</th>
            <th>Temperature</th>
            <th>Humidity</th>
        </tr>
        {% for record in records %}
            <tr>
                <td>{{ record.date }}</td>
                <td>{{ record.index }}</td>
                <td>{{ record.temperature }}</td>
                <td>{{ record.humidity }}</td>
            </tr>
        {% endfor %}
    </table>
    <br>
    <a href="{{ url_for('about') }}">Back to Device List</a>
</body>
</html>
